<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="810" viewBox="0 0 1060 810" role="img" aria-label="current state swimlane process"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#47648a"/></marker></defs><rect width="1060" height="810" fill="white"/><rect x="20" y="20" width="240" height="730" fill="#f5f8ff" stroke="#dbe2eb"/><rect x="20" y="20" width="240" height="45" fill="#edf2f8"/><text x="140" y="49" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#132333">Requester</text><rect x="280" y="20" width="240" height="730" fill="#fafbfd" stroke="#dbe2eb"/><rect x="280" y="20" width="240" height="45" fill="#edf2f8"/><text x="400" y="49" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#132333">Service coordinator</text><rect x="540" y="20" width="240" height="730" fill="#f5f8ff" stroke="#dbe2eb"/><rect x="540" y="20" width="240" height="45" fill="#edf2f8"/><text x="660" y="49" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#132333">ICT technician</text><rect x="800" y="20" width="240" height="730" fill="#fafbfd" stroke="#dbe2eb"/><rect x="800" y="20" width="240" height="45" fill="#edf2f8"/><text x="920" y="49" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#132333">Register / system</text><polyline points="230,142 310,142" fill="none" stroke="#47648a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="405,174 405,280" fill="none" stroke="#47648a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="310,312 230,312" fill="none" stroke="#47648a" stroke-width="2" marker-end="url(#arrow)"/><text x="270.0" y="303.0" text-anchor="middle" font-family="Arial" font-size="14" fill="#30466f" style="paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round">Missing information</text><polyline points="145,344 145,385 405,385 405,344" fill="none" stroke="#47648a" stroke-width="2" marker-end="url(#arrow)"/><text x="405" y="376" text-anchor="middle" font-family="Arial" font-size="14" fill="#30466f" style="paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round">Clarification</text><polyline points="490,312 665,312 665,450" fill="none" stroke="#47648a" stroke-width="2" marker-end="url(#arrow)"/><text x="665" y="303" text-anchor="middle" font-family="Arial" font-size="14" fill="#30466f" style="paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round">Assign via email</text><polyline points="570,482 490,482" fill="none" stroke="#47648a" stroke-width="2" marker-end="url(#arrow)"/><text x="530.0" y="473.0" text-anchor="middle" font-family="Arial" font-size="14" fill="#30466f" style="paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round">Repair note</text><polyline points="405,514 405,620 145,620 145,660" fill="none" stroke="#47648a" stroke-width="2" marker-end="url(#arrow)"/><text x="145" y="611" text-anchor="middle" font-family="Arial" font-size="14" fill="#30466f" style="paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round">If service still fails</text><polyline points="50,692 32,692 32,80 145,80 145,110" fill="none" stroke="#47648a" stroke-width="2" marker-end="url(#arrow)"/><text x="90" y="751" text-anchor="middle" font-family="Arial" font-size="14" fill="#30466f" style="paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round">Repeat report</text><rect x="50" y="110" width="180" height="64" rx="7" fill="white" stroke="#174acb" stroke-width="1.5"/><text x="140" y="136" text-anchor="middle" font-family="Arial" font-size="16" fill="#132333">Detect fault</text><text x="140" y="157" text-anchor="middle" font-family="Arial" font-size="14" fill="#526170">email or phone</text><rect x="310" y="110" width="180" height="64" rx="7" fill="white" stroke="#174acb" stroke-width="1.5"/><text x="400" y="136" text-anchor="middle" font-family="Arial" font-size="16" fill="#132333">Re-enter details</text><text x="400" y="157" text-anchor="middle" font-family="Arial" font-size="14" fill="#526170">into spreadsheet</text><rect x="310" y="280" width="180" height="64" rx="7" fill="white" stroke="#174acb" stroke-width="1.5"/><text x="400" y="306" text-anchor="middle" font-family="Arial" font-size="16" fill="#132333">Clarify and prioritise</text><text x="400" y="327" text-anchor="middle" font-family="Arial" font-size="14" fill="#526170">manual follow-up</text><rect x="50" y="280" width="180" height="64" rx="7" fill="white" stroke="#174acb" stroke-width="1.5"/><text x="140" y="306" text-anchor="middle" font-family="Arial" font-size="16" fill="#132333">Supply missing details</text><text x="140" y="327" text-anchor="middle" font-family="Arial" font-size="14" fill="#526170">or chase status</text><rect x="570" y="450" width="180" height="64" rx="7" fill="white" stroke="#174acb" stroke-width="1.5"/><text x="660" y="476" text-anchor="middle" font-family="Arial" font-size="16" fill="#132333">Diagnose and repair</text><text x="660" y="497" text-anchor="middle" font-family="Arial" font-size="14" fill="#526170">inform coordinator</text><rect x="310" y="450" width="180" height="64" rx="7" fill="white" stroke="#174acb" stroke-width="1.5"/><text x="400" y="476" text-anchor="middle" font-family="Arial" font-size="16" fill="#132333">Update spreadsheet</text><text x="400" y="497" text-anchor="middle" font-family="Arial" font-size="14" fill="#526170">close without confirmation</text><rect x="50" y="660" width="180" height="64" rx="7" fill="white" stroke="#174acb" stroke-width="1.5"/><text x="140" y="686" text-anchor="middle" font-family="Arial" font-size="16" fill="#132333">Discover unresolved fault</text><text x="140" y="707" text-anchor="middle" font-family="Arial" font-size="14" fill="#526170">send another email</text><text x="20" y="782" font-family="Arial" font-size="13" fill="#526170">Invented current state for analysis; not an actual QPS process.</text><text x="20" y="801" font-family="Arial" font-size="13" fill="#526170">Spreadsheet updates have no dependable ownership or protected history.</text></svg>